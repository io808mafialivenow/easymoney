version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: easymoney-postgres
    environment:
      POSTGRES_USER: easymoney
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: easymoney
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U easymoney']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: easymoney-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://easymoney:dev_password@postgres:5432/easymoney
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api

volumes:
  postgres_data:
